<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="960" viewBox="0 0 1920 960">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="960" fill="url(#bg)"/>

  <!-- Title -->
  <text x="960" y="80" text-anchor="middle" fill="#ffffff" font-size="48" font-weight="bold" font-family="Arial,Helvetica,sans-serif">All Actions at a Glance</text>
  <text x="960" y="120" text-anchor="middle" fill="#8b949e" font-size="26" font-family="Arial,Helvetica,sans-serif">Repo Stats and Workflow Status — your GitHub dashboard on Stream Deck</text>

  <!-- Stream Deck mockup: 5 keys wide x 3 tall -->
  <g transform="translate(260, 170)">

    <!-- Row 1: Repo Stats variety -->
    <!-- Key: Stars -->
    <rect x="0" y="0" width="160" height="160" rx="18" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="0" y="0" width="160" height="6" rx="3" fill="#e3b341"/>
    <text x="80" y="52" text-anchor="middle" fill="#8b949e" font-size="18" font-family="Arial,Helvetica,sans-serif">react</text>
    <text x="80" y="95" text-anchor="middle" fill="#e6edf3" font-size="36" font-weight="bold" font-family="Arial,Helvetica,sans-serif">228k</text>
    <text x="80" y="130" text-anchor="middle" fill="#8b949e" font-size="16" font-family="Arial,Helvetica,sans-serif">Stars</text>

    <!-- Key: Issues -->
    <rect x="190" y="0" width="160" height="160" rx="18" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="190" y="0" width="160" height="6" rx="3" fill="#3fb950"/>
    <text x="270" y="52" text-anchor="middle" fill="#8b949e" font-size="18" font-family="Arial,Helvetica,sans-serif">next.js</text>
    <text x="270" y="95" text-anchor="middle" fill="#e6edf3" font-size="36" font-weight="bold" font-family="Arial,Helvetica,sans-serif">3,142</text>
    <text x="270" y="130" text-anchor="middle" fill="#8b949e" font-size="16" font-family="Arial,Helvetica,sans-serif">Issues</text>

    <!-- Key: Forks -->
    <rect x="380" y="0" width="160" height="160" rx="18" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="380" y="0" width="160" height="6" rx="3" fill="#58a6ff"/>
    <text x="460" y="52" text-anchor="middle" fill="#8b949e" font-size="18" font-family="Arial,Helvetica,sans-serif">vscode</text>
    <text x="460" y="95" text-anchor="middle" fill="#e6edf3" font-size="36" font-weight="bold" font-family="Arial,Helvetica,sans-serif">42.6k</text>
    <text x="460" y="130" text-anchor="middle" fill="#8b949e" font-size="16" font-family="Arial,Helvetica,sans-serif">Forks</text>

    <!-- Key: Watchers -->
    <rect x="570" y="0" width="160" height="160" rx="18" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="570" y="0" width="160" height="6" rx="3" fill="#d2a8ff"/>
    <text x="650" y="52" text-anchor="middle" fill="#8b949e" font-size="18" font-family="Arial,Helvetica,sans-serif">deno</text>
    <text x="650" y="95" text-anchor="middle" fill="#e6edf3" font-size="36" font-weight="bold" font-family="Arial,Helvetica,sans-serif">987</text>
    <text x="650" y="130" text-anchor="middle" fill="#8b949e" font-size="16" font-family="Arial,Helvetica,sans-serif">Watchers</text>

    <!-- Key: PRs -->
    <rect x="760" y="0" width="160" height="160" rx="18" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="760" y="0" width="160" height="6" rx="3" fill="#3fb950"/>
    <text x="840" y="52" text-anchor="middle" fill="#8b949e" font-size="18" font-family="Arial,Helvetica,sans-serif">rust</text>
    <text x="840" y="95" text-anchor="middle" fill="#e6edf3" font-size="36" font-weight="bold" font-family="Arial,Helvetica,sans-serif">256</text>
    <text x="840" y="130" text-anchor="middle" fill="#8b949e" font-size="16" font-family="Arial,Helvetica,sans-serif">Pull Requests</text>

    <!-- Row 2: Mixed stat types + workflow -->
    <!-- Key: Language -->
    <rect x="0" y="190" width="160" height="160" rx="18" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="0" y="190" width="160" height="6" rx="3" fill="#f78166"/>
    <text x="80" y="242" text-anchor="middle" fill="#8b949e" font-size="18" font-family="Arial,Helvetica,sans-serif">react</text>
    <text x="80" y="282" text-anchor="middle" fill="#e6edf3" font-size="28" font-weight="bold" font-family="Arial,Helvetica,sans-serif">JavaScript</text>
    <text x="80" y="322" text-anchor="middle" fill="#8b949e" font-size="16" font-family="Arial,Helvetica,sans-serif">Language</text>

    <!-- Key: Size -->
    <rect x="190" y="190" width="160" height="160" rx="18" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="190" y="190" width="160" height="6" rx="3" fill="#8b949e"/>
    <text x="270" y="242" text-anchor="middle" fill="#8b949e" font-size="18" font-family="Arial,Helvetica,sans-serif">vscode</text>
    <text x="270" y="282" text-anchor="middle" fill="#e6edf3" font-size="30" font-weight="bold" font-family="Arial,Helvetica,sans-serif">1.8 GB</text>
    <text x="270" y="322" text-anchor="middle" fill="#8b949e" font-size="16" font-family="Arial,Helvetica,sans-serif">Size</text>

    <!-- Key: Workflow Success -->
    <rect x="380" y="190" width="160" height="160" rx="18" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="380" y="190" width="160" height="6" rx="3" fill="#3fb950"/>
    <text x="460" y="232" text-anchor="middle" fill="#8b949e" font-size="18" font-family="Arial,Helvetica,sans-serif">deploy</text>
    <g transform="translate(428, 248) scale(1.5)">
      <polyline points="8,19 15,26 28,12" fill="none" stroke="#3fb950" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="460" y="332" text-anchor="middle" fill="#8b949e" font-size="16" font-family="Arial,Helvetica,sans-serif">Success</text>

    <!-- Key: Workflow Failure -->
    <rect x="570" y="190" width="160" height="160" rx="18" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="570" y="190" width="160" height="6" rx="3" fill="#f85149"/>
    <text x="650" y="232" text-anchor="middle" fill="#8b949e" font-size="18" font-family="Arial,Helvetica,sans-serif">tests</text>
    <g transform="translate(618, 248) scale(1.5)">
      <line x1="10" y1="10" x2="26" y2="26" stroke="#f85149" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="26" y1="10" x2="10" y2="26" stroke="#f85149" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <text x="650" y="332" text-anchor="middle" fill="#8b949e" font-size="16" font-family="Arial,Helvetica,sans-serif">Failure</text>

    <!-- Key: Deploying -->
    <rect x="760" y="190" width="160" height="160" rx="18" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="760" y="190" width="160" height="6" rx="3" fill="#a371f7"/>
    <text x="840" y="232" text-anchor="middle" fill="#8b949e" font-size="18" font-family="Arial,Helvetica,sans-serif">pipeline</text>
    <g transform="translate(808, 248) scale(1.5)">
      <polygon points="18,6 28,28 18,22 8,28" fill="#a371f7"/>
    </g>
    <text x="840" y="332" text-anchor="middle" fill="#8b949e" font-size="16" font-family="Arial,Helvetica,sans-serif">production</text>

    <!-- Row 3: More variations -->
    <!-- Key: License -->
    <rect x="0" y="380" width="160" height="160" rx="18" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="0" y="380" width="160" height="6" rx="3" fill="#d29922"/>
    <text x="80" y="432" text-anchor="middle" fill="#8b949e" font-size="18" font-family="Arial,Helvetica,sans-serif">node</text>
    <text x="80" y="472" text-anchor="middle" fill="#e6edf3" font-size="30" font-weight="bold" font-family="Arial,Helvetica,sans-serif">MIT</text>
    <text x="80" y="512" text-anchor="middle" fill="#8b949e" font-size="16" font-family="Arial,Helvetica,sans-serif">License</text>

    <!-- Key: Branch -->
    <rect x="190" y="380" width="160" height="160" rx="18" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="190" y="380" width="160" height="6" rx="3" fill="#58a6ff"/>
    <text x="270" y="432" text-anchor="middle" fill="#8b949e" font-size="18" font-family="Arial,Helvetica,sans-serif">my-app</text>
    <text x="270" y="472" text-anchor="middle" fill="#e6edf3" font-size="28" font-weight="bold" font-family="Arial,Helvetica,sans-serif">main</text>
    <text x="270" y="512" text-anchor="middle" fill="#8b949e" font-size="16" font-family="Arial,Helvetica,sans-serif">Branch</text>

    <!-- Key: Visibility -->
    <rect x="380" y="380" width="160" height="160" rx="18" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="380" y="380" width="160" height="6" rx="3" fill="#8b949e"/>
    <text x="460" y="432" text-anchor="middle" fill="#8b949e" font-size="18" font-family="Arial,Helvetica,sans-serif">secrets</text>
    <text x="460" y="472" text-anchor="middle" fill="#e6edf3" font-size="28" font-weight="bold" font-family="Arial,Helvetica,sans-serif">Private</text>
    <text x="460" y="512" text-anchor="middle" fill="#8b949e" font-size="16" font-family="Arial,Helvetica,sans-serif">Visibility</text>

    <!-- Key: Workflow Queued -->
    <rect x="570" y="380" width="160" height="160" rx="18" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="570" y="380" width="160" height="6" rx="3" fill="#58a6ff"/>
    <text x="650" y="422" text-anchor="middle" fill="#8b949e" font-size="18" font-family="Arial,Helvetica,sans-serif">nightly</text>
    <g transform="translate(618, 438) scale(1.5)">
      <circle cx="18" cy="18" r="11" fill="none" stroke="#58a6ff" stroke-width="2.5"/>
      <line x1="18" y1="11" x2="18" y2="18" stroke="#58a6ff" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="18" y1="18" x2="24" y2="18" stroke="#58a6ff" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <text x="650" y="522" text-anchor="middle" fill="#8b949e" font-size="16" font-family="Arial,Helvetica,sans-serif">Queued</text>

    <!-- Key: Workflow In Progress -->
    <rect x="760" y="380" width="160" height="160" rx="18" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="760" y="380" width="160" height="6" rx="3" fill="#d29922"/>
    <text x="840" y="422" text-anchor="middle" fill="#8b949e" font-size="18" font-family="Arial,Helvetica,sans-serif">build</text>
    <g transform="translate(808, 438) scale(1.5)">
      <path d="M18,6 A12,12 0 1,1 6,18" fill="none" stroke="#d29922" stroke-width="3" stroke-linecap="round"/>
      <polygon points="6,12 6,20 11,16" fill="#d29922"/>
    </g>
    <text x="840" y="522" text-anchor="middle" fill="#8b949e" font-size="16" font-family="Arial,Helvetica,sans-serif">Running</text>
  </g>

  <!-- Right side labels -->
  <g transform="translate(1280, 170)">
    <rect x="0" y="0" width="520" height="160" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="40" y="45" fill="#e3b341" font-size="28" font-weight="bold" font-family="Arial,Helvetica,sans-serif">🔢 Repo Stats</text>
    <text x="40" y="80" fill="#8b949e" font-size="20" font-family="Arial,Helvetica,sans-serif">10 stat types: stars, issues,</text>
    <text x="40" y="108" fill="#8b949e" font-size="20" font-family="Arial,Helvetica,sans-serif">forks, watchers, PRs, language,</text>
    <text x="40" y="136" fill="#8b949e" font-size="20" font-family="Arial,Helvetica,sans-serif">size, license, branch, visibility</text>
  </g>

  <g transform="translate(1280, 360)">
    <rect x="0" y="0" width="520" height="160" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="40" y="45" fill="#3fb950" font-size="28" font-weight="bold" font-family="Arial,Helvetica,sans-serif">⚙️ Workflow Status</text>
    <text x="40" y="80" fill="#8b949e" font-size="20" font-family="Arial,Helvetica,sans-serif">14 status icons with color coding</text>
    <text x="40" y="108" fill="#8b949e" font-size="20" font-family="Arial,Helvetica,sans-serif">Deployment tracking + filtering</text>
    <text x="40" y="136" fill="#8b949e" font-size="20" font-family="Arial,Helvetica,sans-serif">Press to refresh, auto-updates</text>
  </g>

  <g transform="translate(1280, 550)">
    <rect x="0" y="0" width="520" height="130" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="40" y="45" fill="#58a6ff" font-size="28" font-weight="bold" font-family="Arial,Helvetica,sans-serif">🎯 Smart Config</text>
    <text x="40" y="80" fill="#8b949e" font-size="20" font-family="Arial,Helvetica,sans-serif">Searchable dropdowns, cascading</text>
    <text x="40" y="108" fill="#8b949e" font-size="20" font-family="Arial,Helvetica,sans-serif">filters, one-time token setup</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="920" width="1920" height="40" fill="#161b22"/>
  <rect x="0" y="920" width="1920" height="1" fill="#30363d"/>
  <text x="960" y="948" text-anchor="middle" fill="#8b949e" font-size="18" font-family="Arial,Helvetica,sans-serif">Stream Deck 6.9+ · macOS 13+ / Windows 10+ · GitHub PAT required</text>
</svg>
