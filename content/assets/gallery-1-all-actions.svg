<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="960" viewBox="0 0 1920 960">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="960" fill="url(#bg)"/>

  <!-- Title -->
  <text x="960" y="80" text-anchor="middle" fill="#ffffff" font-size="48" font-weight="bold" font-family="Arial,Helvetica,sans-serif">12 Actions for Every Workflow</text>
  <text x="960" y="120" text-anchor="middle" fill="#8b949e" font-size="26" font-family="Arial,Helvetica,sans-serif">Repo stats, workflows, PRs, issues, releases, security, and more</text>

  <!-- 4×3 Key Grid (140×140 keys, 20px gap) -->
  <g transform="translate(80, 170)">

    <!-- Row 1: Stats & Monitoring -->

    <!-- Key 1: Stars -->
    <rect x="0" y="0" width="140" height="140" rx="18" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="0" y="0" width="140" height="6" rx="3" fill="#e3b341"/>
    <text x="70" y="38" text-anchor="middle" fill="#8b949e" font-size="16" font-family="Arial,Helvetica,sans-serif">react</text>
    <text x="70" y="78" text-anchor="middle" fill="#e6edf3" font-size="32" font-weight="bold" font-family="Arial,Helvetica,sans-serif">228k</text>
    <text x="70" y="112" text-anchor="middle" fill="#8b949e" font-size="14" font-family="Arial,Helvetica,sans-serif">Stars</text>

    <!-- Key 2: Workflow Status -->
    <rect x="160" y="0" width="140" height="140" rx="18" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="160" y="0" width="140" height="6" rx="3" fill="#3fb950"/>
    <text x="230" y="32" text-anchor="middle" fill="#8b949e" font-size="16" font-family="Arial,Helvetica,sans-serif">deploy</text>
    <g transform="translate(210, 55)">
      <polyline points="0,16 14,30 40,0" fill="none" stroke="#3fb950" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="230" y="122" text-anchor="middle" fill="#8b949e" font-size="14" font-family="Arial,Helvetica,sans-serif">Success</text>

    <!-- Key 3: PR Counter -->
    <rect x="320" y="0" width="140" height="140" rx="18" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="320" y="0" width="140" height="6" rx="3" fill="#3fb950"/>
    <text x="390" y="38" text-anchor="middle" fill="#8b949e" font-size="16" font-family="Arial,Helvetica,sans-serif">next.js</text>
    <text x="390" y="78" text-anchor="middle" fill="#e6edf3" font-size="32" font-weight="bold" font-family="Arial,Helvetica,sans-serif">47</text>
    <text x="390" y="112" text-anchor="middle" fill="#8b949e" font-size="14" font-family="Arial,Helvetica,sans-serif">Open PRs</text>

    <!-- Key 4: Issue Counter -->
    <rect x="480" y="0" width="140" height="140" rx="18" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="480" y="0" width="140" height="6" rx="3" fill="#3fb950"/>
    <text x="550" y="38" text-anchor="middle" fill="#8b949e" font-size="16" font-family="Arial,Helvetica,sans-serif">vscode</text>
    <text x="550" y="78" text-anchor="middle" fill="#e6edf3" font-size="32" font-weight="bold" font-family="Arial,Helvetica,sans-serif">892</text>
    <text x="550" y="112" text-anchor="middle" fill="#8b949e" font-size="14" font-family="Arial,Helvetica,sans-serif">Open Issues</text>

    <!-- Row 2: Tracking & Comparison -->

    <!-- Key 5: Release -->
    <rect x="0" y="160" width="140" height="140" rx="18" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="0" y="160" width="140" height="6" rx="3" fill="#3fb950"/>
    <text x="70" y="198" text-anchor="middle" fill="#8b949e" font-size="16" font-family="Arial,Helvetica,sans-serif">deno</text>
    <text x="70" y="238" text-anchor="middle" fill="#e6edf3" font-size="30" font-weight="bold" font-family="Arial,Helvetica,sans-serif">v1.41</text>
    <text x="70" y="272" text-anchor="middle" fill="#8b949e" font-size="14" font-family="Arial,Helvetica,sans-serif">Release</text>

    <!-- Key 6: Commits -->
    <rect x="160" y="160" width="140" height="140" rx="18" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="160" y="160" width="140" height="6" rx="3" fill="#58a6ff"/>
    <text x="230" y="198" text-anchor="middle" fill="#8b949e" font-size="16" font-family="Arial,Helvetica,sans-serif">rust</text>
    <text x="230" y="238" text-anchor="middle" fill="#e6edf3" font-size="32" font-weight="bold" font-family="Arial,Helvetica,sans-serif">156</text>
    <text x="230" y="272" text-anchor="middle" fill="#8b949e" font-size="14" font-family="Arial,Helvetica,sans-serif">7 Days</text>

    <!-- Key 7: Branch Compare -->
    <rect x="320" y="160" width="140" height="140" rx="18" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="320" y="160" width="140" height="6" rx="3" fill="#d29922"/>
    <text x="390" y="198" text-anchor="middle" fill="#8b949e" font-size="16" font-family="Arial,Helvetica,sans-serif">my-app</text>
    <text x="390" y="238" text-anchor="middle" fill="#e6edf3" font-size="28" font-weight="bold" font-family="Arial,Helvetica,sans-serif">↑3 ↓2</text>
    <text x="390" y="272" text-anchor="middle" fill="#8b949e" font-size="14" font-family="Arial,Helvetica,sans-serif">Diverged</text>

    <!-- Key 8: PR Queue -->
    <rect x="480" y="160" width="140" height="140" rx="18" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="480" y="160" width="140" height="6" rx="3" fill="#58a6ff"/>
    <text x="550" y="198" text-anchor="middle" fill="#8b949e" font-size="16" font-family="Arial,Helvetica,sans-serif">my-org</text>
    <text x="550" y="238" text-anchor="middle" fill="#e6edf3" font-size="32" font-weight="bold" font-family="Arial,Helvetica,sans-serif">3</text>
    <text x="550" y="272" text-anchor="middle" fill="#8b949e" font-size="14" font-family="Arial,Helvetica,sans-serif">Reviews</text>

    <!-- Row 3: Advanced & SD+ -->

    <!-- Key 9: Fleet -->
    <rect x="0" y="320" width="140" height="140" rx="18" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="0" y="320" width="140" height="6" rx="3" fill="#58a6ff"/>
    <text x="70" y="358" text-anchor="middle" fill="#8b949e" font-size="16" font-family="Arial,Helvetica,sans-serif">fleet</text>
    <text x="70" y="398" text-anchor="middle" fill="#e6edf3" font-size="32" font-weight="bold" font-family="Arial,Helvetica,sans-serif">✓ 5</text>
    <text x="70" y="432" text-anchor="middle" fill="#8b949e" font-size="14" font-family="Arial,Helvetica,sans-serif">Fleet</text>

    <!-- Key 10: Security -->
    <rect x="160" y="320" width="140" height="140" rx="18" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="160" y="320" width="140" height="6" rx="3" fill="#3fb950"/>
    <text x="230" y="358" text-anchor="middle" fill="#8b949e" font-size="16" font-family="Arial,Helvetica,sans-serif">api</text>
    <text x="230" y="398" text-anchor="middle" fill="#e6edf3" font-size="32" font-weight="bold" font-family="Arial,Helvetica,sans-serif">A</text>
    <text x="230" y="432" text-anchor="middle" fill="#8b949e" font-size="14" font-family="Arial,Helvetica,sans-serif">Security</text>

    <!-- Key 11: Heatmap (SD+ encoder-only) -->
    <rect x="320" y="320" width="140" height="140" rx="18" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="320" y="320" width="140" height="6" rx="3" fill="#3fb950"/>
    <text x="390" y="388" text-anchor="middle" fill="#a371f7" font-size="26" font-weight="bold" font-family="Arial,Helvetica,sans-serif">SD+</text>
    <text x="390" y="432" text-anchor="middle" fill="#8b949e" font-size="14" font-family="Arial,Helvetica,sans-serif">Heatmap</text>

    <!-- Key 12: Network (SD+ encoder-only) -->
    <rect x="480" y="320" width="140" height="140" rx="18" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="480" y="320" width="140" height="6" rx="3" fill="#d2a8ff"/>
    <text x="550" y="388" text-anchor="middle" fill="#a371f7" font-size="26" font-weight="bold" font-family="Arial,Helvetica,sans-serif">SD+</text>
    <text x="550" y="432" text-anchor="middle" fill="#8b949e" font-size="14" font-family="Arial,Helvetica,sans-serif">Network</text>

  </g>

  <!-- Right side info boxes -->

  <!-- Box 1: Stream Deck+ -->
  <g transform="translate(1300, 170)">
    <rect x="0" y="0" width="540" height="180" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="40" y="45" fill="#a371f7" font-size="28" font-weight="bold" font-family="Arial,Helvetica,sans-serif">🎛️ Stream Deck+</text>
    <text x="40" y="85" fill="#8b949e" font-size="20" font-family="Arial,Helvetica,sans-serif">Encoder support for all 12 actions</text>
    <text x="40" y="115" fill="#8b949e" font-size="20" font-family="Arial,Helvetica,sans-serif">Touch strip visualizations</text>
    <text x="40" y="145" fill="#8b949e" font-size="20" font-family="Arial,Helvetica,sans-serif">Dial rotate, tap, long-touch</text>
  </g>

  <!-- Box 2: Smart Config -->
  <g transform="translate(1300, 380)">
    <rect x="0" y="0" width="540" height="140" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="40" y="45" fill="#58a6ff" font-size="28" font-weight="bold" font-family="Arial,Helvetica,sans-serif">🎯 Smart Config</text>
    <text x="40" y="85" fill="#8b949e" font-size="20" font-family="Arial,Helvetica,sans-serif">Searchable dropdowns</text>
    <text x="40" y="115" fill="#8b949e" font-size="20" font-family="Arial,Helvetica,sans-serif">One-time token setup</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="920" width="1920" height="40" fill="#161b22"/>
  <rect x="0" y="920" width="1920" height="1" fill="#30363d"/>
  <text x="960" y="948" text-anchor="middle" fill="#8b949e" font-size="18" font-family="Arial,Helvetica,sans-serif">Stream Deck 6.9+ · macOS 13+ / Windows 10+ · GitHub PAT required</text>
</svg>
