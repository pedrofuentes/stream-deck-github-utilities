<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="960" viewBox="0 0 1920 960">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e3b341"/>
      <stop offset="20%" stop-color="#3fb950"/>
      <stop offset="40%" stop-color="#58a6ff"/>
      <stop offset="60%" stop-color="#d2a8ff"/>
      <stop offset="80%" stop-color="#f78166"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
    <!-- Sparkline gradient for touch strip -->
    <linearGradient id="sparkline-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="960" fill="url(#bg)"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1920" height="4" fill="url(#accent-bar)"/>

  <!-- ============================================ -->
  <!-- Left side: Title, subtitle, tagline          -->
  <!-- ============================================ -->
  <g transform="translate(120, 180)">
    <text x="0" y="0" fill="#ffffff" font-size="72" font-weight="bold" font-family="Arial,Helvetica,sans-serif">GitHub Utilities</text>
    <text x="0" y="56" fill="#8b949e" font-size="32" font-family="Arial,Helvetica,sans-serif">for Stream Deck</text>
    <text x="0" y="140" fill="#e6edf3" font-size="28" font-family="Arial,Helvetica,sans-serif">Your GitHub dashboard, one glance away.</text>
    <text x="0" y="182" fill="#8b949e" font-size="24" font-family="Arial,Helvetica,sans-serif">Now with Stream Deck+ support.</text>
  </g>

  <!-- ============================================ -->
  <!-- Right side: Key mockups — Row 1 (3 keys)    -->
  <!-- ============================================ -->
  <g transform="translate(1050, 100)">

    <!-- Key 1: Stars -->
    <g>
      <rect x="0" y="0" width="200" height="200" rx="22" fill="#161b22" stroke="#30363d" stroke-width="2"/>
      <rect x="0" y="0" width="200" height="6" rx="3" fill="#e3b341"/>
      <text x="100" y="62" text-anchor="middle" fill="#8b949e" font-size="22" font-family="Arial,Helvetica,sans-serif">react</text>
      <text x="100" y="118" text-anchor="middle" fill="#e6edf3" font-size="44" font-weight="bold" font-family="Arial,Helvetica,sans-serif">228k</text>
      <text x="100" y="164" text-anchor="middle" fill="#8b949e" font-size="22" font-family="Arial,Helvetica,sans-serif">Stars</text>
    </g>

    <!-- Key 2: PR Review Queue -->
    <g transform="translate(230, 0)">
      <rect x="0" y="0" width="200" height="200" rx="22" fill="#161b22" stroke="#30363d" stroke-width="2"/>
      <rect x="0" y="0" width="200" height="6" rx="3" fill="#58a6ff"/>
      <text x="100" y="62" text-anchor="middle" fill="#8b949e" font-size="22" font-family="Arial,Helvetica,sans-serif">my-org</text>
      <text x="100" y="118" text-anchor="middle" fill="#e6edf3" font-size="44" font-weight="bold" font-family="Arial,Helvetica,sans-serif">3</text>
      <text x="100" y="164" text-anchor="middle" fill="#8b949e" font-size="22" font-family="Arial,Helvetica,sans-serif">Review Queue</text>
    </g>

    <!-- Key 3: Release Monitor -->
    <g transform="translate(460, 0)">
      <rect x="0" y="0" width="200" height="200" rx="22" fill="#161b22" stroke="#30363d" stroke-width="2"/>
      <rect x="0" y="0" width="200" height="6" rx="3" fill="#3fb950"/>
      <text x="100" y="62" text-anchor="middle" fill="#8b949e" font-size="22" font-family="Arial,Helvetica,sans-serif">next.js</text>
      <text x="100" y="118" text-anchor="middle" fill="#e6edf3" font-size="44" font-weight="bold" font-family="Arial,Helvetica,sans-serif">v14.1</text>
      <text x="100" y="164" text-anchor="middle" fill="#8b949e" font-size="22" font-family="Arial,Helvetica,sans-serif">Release</text>
    </g>

  </g>

  <!-- ============================================ -->
  <!-- Right side: Key mockups — Row 2 (3 keys)    -->
  <!-- ============================================ -->
  <g transform="translate(1050, 330)">

    <!-- Key 4: Workflow Success -->
    <g>
      <rect x="0" y="0" width="200" height="200" rx="22" fill="#161b22" stroke="#30363d" stroke-width="2"/>
      <rect x="0" y="0" width="200" height="6" rx="3" fill="#3fb950"/>
      <text x="100" y="50" text-anchor="middle" fill="#8b949e" font-size="22" font-family="Arial,Helvetica,sans-serif">deploy</text>
      <!-- Checkmark icon -->
      <g transform="translate(64, 66) scale(2.0)">
        <polyline points="8,19 15,26 28,12" fill="none" stroke="#3fb950" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="100" y="178" text-anchor="middle" fill="#8b949e" font-size="20" font-family="Arial,Helvetica,sans-serif">Success</text>
    </g>

    <!-- Key 5: Security Health -->
    <g transform="translate(230, 0)">
      <rect x="0" y="0" width="200" height="200" rx="22" fill="#161b22" stroke="#30363d" stroke-width="2"/>
      <rect x="0" y="0" width="200" height="6" rx="3" fill="#3fb950"/>
      <text x="100" y="62" text-anchor="middle" fill="#8b949e" font-size="22" font-family="Arial,Helvetica,sans-serif">api</text>
      <text x="100" y="118" text-anchor="middle" fill="#e6edf3" font-size="44" font-weight="bold" font-family="Arial,Helvetica,sans-serif">A</text>
      <text x="100" y="164" text-anchor="middle" fill="#8b949e" font-size="22" font-family="Arial,Helvetica,sans-serif">Security</text>
    </g>

    <!-- Key 6: Fleet Monitor -->
    <g transform="translate(460, 0)">
      <rect x="0" y="0" width="200" height="200" rx="22" fill="#161b22" stroke="#30363d" stroke-width="2"/>
      <rect x="0" y="0" width="200" height="6" rx="3" fill="#58a6ff"/>
      <text x="100" y="62" text-anchor="middle" fill="#8b949e" font-size="22" font-family="Arial,Helvetica,sans-serif">fleet</text>
      <text x="100" y="118" text-anchor="middle" fill="#e6edf3" font-size="38" font-weight="bold" font-family="Arial,Helvetica,sans-serif">✓ 5 PRs</text>
      <text x="100" y="164" text-anchor="middle" fill="#8b949e" font-size="22" font-family="Arial,Helvetica,sans-serif">Fleet</text>
    </g>

  </g>

  <!-- ============================================ -->
  <!-- Stream Deck+ Touch Strip mockup              -->
  <!-- ============================================ -->
  <g transform="translate(1050, 570)">
    <!-- Touch strip background -->
    <rect x="0" y="0" width="660" height="50" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>

    <!-- Sparkline fill area -->
    <path d="M20,40 L80,30 L140,34 L200,22 L260,26 L320,18 L380,24 L440,14 L500,20 L560,10 L620,16 L640,12 L640,44 L20,44 Z"
          fill="url(#sparkline-grad)" opacity="0.6"/>

    <!-- Sparkline stroke -->
    <path d="M20,40 L80,30 L140,34 L200,22 L260,26 L320,18 L380,24 L440,14 L500,20 L560,10 L620,16 L640,12"
          fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

    <!-- Label -->
    <text x="330" y="72" text-anchor="middle" fill="#8b949e" font-size="16" font-family="Arial,Helvetica,sans-serif">Touch Strip — Stream Deck+</text>
  </g>

  <!-- ============================================ -->
  <!-- Bottom feature strip                         -->
  <!-- ============================================ -->
  <rect x="0" y="860" width="1920" height="100" fill="#161b22"/>
  <rect x="0" y="860" width="1920" height="1" fill="#30363d"/>

  <g transform="translate(0, 920)">
    <text x="192" y="0" text-anchor="middle" fill="#e3b341" font-size="22" font-weight="bold" font-family="Arial,Helvetica,sans-serif">12 Actions</text>
    <text x="576" y="0" text-anchor="middle" fill="#3fb950" font-size="22" font-weight="bold" font-family="Arial,Helvetica,sans-serif">Stream Deck+</text>
    <text x="960" y="0" text-anchor="middle" fill="#58a6ff" font-size="22" font-weight="bold" font-family="Arial,Helvetica,sans-serif">Touch Strip Visuals</text>
    <text x="1344" y="0" text-anchor="middle" fill="#d2a8ff" font-size="22" font-weight="bold" font-family="Arial,Helvetica,sans-serif">Smart Dropdowns</text>
    <text x="1728" y="0" text-anchor="middle" fill="#f78166" font-size="22" font-weight="bold" font-family="Arial,Helvetica,sans-serif">Auto-Refresh</text>
  </g>
</svg>
